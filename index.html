<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="google-site-verification"
      content="bkz6oWil-GxGHs5ev6KDE4SDLsYMgkDthvSKnFiuWwQ"
    />
    <script>
      (function () {
        try {
          var key = "monely-theme";
          var legacy = ["vayly-theme", "loan-manager-theme"];
          var stored = localStorage.getItem(key);
          if (!stored) {
            for (var i = 0; i < legacy.length; i++) {
              stored = localStorage.getItem(legacy[i]);
              if (stored) break;
            }
          }
          var theme =
            stored === "light" || stored === "dark" || stored === "system"
              ? stored
              : "system";
          var dark =
            theme === "dark" ||
            (theme === "system" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <link
      rel="preload"
      as="image"
      href="/hero_image.webp"
      imagesrcset="/hero_image-sm.webp 960w, /hero_image.webp 1280w"
      imagesizes="100vw"
      type="image/webp"
      fetchpriority="high"
    />
    <style>
      /* Early paint before React: LCP shell + hide SEO text flash */
      .ride-lcp-shell {
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: #eef1ef;
        pointer-events: none;
      }
      .dark .ride-lcp-shell {
        background: #0f1412;
      }
      .ride-lcp-shell img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center 40%;
      }
      .seo-prerender {
        position: absolute !important;
        width: 1px !important;
        height: 1px !important;
        padding: 0 !important;
        margin: -1px !important;
        overflow: hidden !important;
        clip: rect(0, 0, 0, 0) !important;
        white-space: nowrap !important;
        border: 0 !important;
      }
    </style>
    <title>Monely</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

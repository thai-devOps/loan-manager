<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="google-site-verification"
      content="bkz6oWil-GxGHs5ev6KDE4SDLsYMgkDthvSKnFiuWwQ"
    />
    <script>
      (function () {
        try {
          var key = "monely-theme";
          var legacy = ["vayly-theme", "loan-manager-theme"];
          var stored = localStorage.getItem(key);
          if (!stored) {
            for (var i = 0; i < legacy.length; i++) {
              stored = localStorage.getItem(legacy[i]);
              if (stored) break;
            }
          }
          var theme =
            stored === "light" || stored === "dark" || stored === "system"
              ? stored
              : "system";
          var dark =
            theme === "dark" ||
            (theme === "system" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <link rel="preload" as="image" href="/hero_image.webp" type="image/webp" fetchpriority="high" />
    <title>Monely</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
